version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Deux PR au plus par semaine : les versions majeures ensemble, le reste ensemble.
    groups:
      majeures:
        patterns: ["*"]
        update-types: ["major"]
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      majeures:
        patterns: ["*"]
        update-types: ["major"]
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
