# Publie le site sur GitHub Pages à chaque push sur main, et chaque jour pour reprendre les données fusionnées dans l'app (Settings > Pages > Source : GitHub Actions).
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Le site affiche le fichier compilé de l'app (scripts/fetch-dataset.mjs) : dépôt public, sans jeton.
      - uses: actions/checkout@v7
        with:
          repository: danny-gca/elire-app
          path: elire-app
          sparse-checkout: src/data/dataset.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run check
        env:
          ELIRE_APP_DIR: elire-app
      # Astro génère un dossier « _astro » que Jekyll ignorerait.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
