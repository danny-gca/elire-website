# Publie le site sur GitHub Pages à chaque push sur main (Settings > Pages > Source : GitHub Actions) ; les données de l'app sont relues à ce moment-là.
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Le site affiche le fichier compilé de la dernière release de l'app, pas de main (scripts/fetch-dataset.mjs).
      - id: release
        run: |
          tag=$(gh release view --repo danny-gca/elire-app --json tagName --jq .tagName)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          repository: danny-gca/elire-app
          ref: ${{ steps.release.outputs.tag }}
          path: elire-app
          sparse-checkout: src/data/dataset.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: npm ci
      - run: npm run check
        env:
          ELIRE_APP_DIR: elire-app
          ELIRE_APP_VERSION: ${{ steps.release.outputs.tag }}
      # Tests unitaires puis tests du site construit (CSV, onglets, ancres, chiffres, aucune requête tierce).
      - run: npm test
        env:
          ELIRE_APP_DIR: elire-app
          ELIRE_APP_VERSION: ${{ steps.release.outputs.tag }}
      # Astro génère un dossier « _astro » que Jekyll ignorerait.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
