# Vérifie chaque pull request (Astro check et build) : à rendre obligatoire dans le ruleset de main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Le site affiche le fichier compilé de l'app (scripts/fetch-dataset.mjs) : dépôt public, sans jeton.
      - uses: actions/checkout@v7
        with:
          repository: danny-gca/elire-app
          path: elire-app
          sparse-checkout: src/data/dataset.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run check
        env:
          ELIRE_APP_DIR: elire-app
